name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (asn1c fork, extractor, viewer, headless)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      __EGL_VENDOR_LIBRARY_FILENAMES: /usr/share/glvnd/egl_vendor.d/50_mesa.json
    steps:
      - uses: actions/checkout@v4
      - name: Install autotools, bison, flex, SDL3 build dependencies and Mesa
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            autoconf automake libtool bison flex \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev \
            libegl-dev libgl-dev libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Configure (fetches and builds the pinned asn1c fork and Strata)
        run: cmake -S . -B build -DASN1VIZ_WARNINGS_AS_ERRORS=ON -Wno-dev
      - name: Build
        run: cmake --build build -j4
      - name: Tests
        run: ctest --test-dir build --output-on-failure
      - name: Headless renders and ray picking
        run: |
          mkdir -p shots
          ./build/asn1-viz datasets/pkix/certificate.layout.json --headless --shot shots/pkix-strips.png \
            --pick Certificate.tbsCertificate.validity --links 2 | tee pick.log
          grep -q 'selected Certificate.tbsCertificate.validity' pick.log
          # A real click through strata_raycast_meshes: the pixel lands on period's length.
          ./build/asn1-viz datasets/demo/msg.layout.json --headless --shot shots/demo-click.png --click 330 330 | tee click.log
          grep -q 'selected Msg.period' click.log
          # The canonical overlay: the strict check's field, in the imported lane.
          ./build/asn1-viz datasets/pkix/certificate-canonical.layout.json --headless --shot shots/pkix-canonical.png \
            --pick Certificate.tbsCertificate.serialNumber --lane 1 --links 3 | tee canon.log
          grep -q 'selected Certificate.tbsCertificate.serialNumber' canon.log
          # The schema city, picked by name.
          ./build/asn1-viz datasets/pkix/schema.json --headless --shot shots/pkix-city.png --pick Certificate --hops 3 | tee city.log
          grep -q 'selected Certificate' city.log
          ./build/asn1-viz datasets/recursion/schema.json --headless --shot shots/recursion-city.png --pick Everything | tee rec.log
          grep -q 'selected Everything' rec.log
          # The compilation replay (RFC 0034 K1) on the demo trace: the finished
          # run with a floor band picked by name, and a short replay.
          ./build/asn1-viz datasets/demo/compile.json --headless --shot shots/demo-compile.png --at 1 \
            --pick Msg/emit_member_table | tee compile.log
          grep -q 'selected Msg/emit_member_table' compile.log
          grep -q 'stage Save' compile.log
          # Real clicks through strata_raycast_meshes: a floor band of Msg, and a skeleton in the library.
          ./build/asn1-viz datasets/demo/compile.json --headless --shot shots/demo-compile-band.png --at 1 \
            --click 438 290 | tee band.log
          grep -q 'selected Msg/emit_member_table' band.log
          ./build/asn1-viz datasets/demo/compile.json --headless --shot shots/demo-compile-skeleton.png --at 1 \
            --click 780 380 | tee skel.log
          grep -qE 'selected [A-Za-z0-9_]+[.][ch]$' skel.log
          mkdir -p shots/demo-replay
          ./build/asn1-viz datasets/demo/compile.json --headless --replay shots/demo-replay --frames 6 | tee replay.log
          grep -q 'wrote 6 frames' replay.log
          # Compare mode (RFC 0034 G4): PKIX against its -fwide-types run, a floor picked by
          # name, and a real click on the demo's OER floor (gone without OER).
          ./build/asn1-viz --compare datasets/pkix/compile.json datasets/pkix/compile-fwide-types.json --headless \
            --shot shots/pkix-compare.png --pick BasicConstraints/emit_type_DEF | tee compare.log
          grep -q -- '-fwide-types: 9 types changed, 26292 lines -> 26172' compare.log
          grep -q 'selected BasicConstraints/emit_type_DEF' compare.log
          ./build/asn1-viz --compare datasets/demo/compile.json datasets/demo/compile-no-gen-OER.json --headless \
            --shot shots/demo-compare.png --click 612 148 | tee compare-click.log
          grep -q 'selected Msg/emit_member_OER_constraints' compare-click.log
          test -s shots/pkix-compare.png && test -s shots/demo-compare.png
          test -s shots/demo-compile.png && test -s shots/demo-replay/frame-005.png
          test -s shots/pkix-strips.png && test -s shots/demo-click.png && test -s shots/pkix-canonical.png
          test -s shots/pkix-city.png && test -s shots/recursion-city.png
      - uses: actions/upload-artifact@v4
        with:
          name: shots-linux
          path: shots/

  windows:
    name: Windows (MSVC, viewer and tests)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DASN1VIZ_WARNINGS_AS_ERRORS=ON -Wno-dev
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
